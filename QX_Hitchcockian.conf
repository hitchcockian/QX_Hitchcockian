[general]
server_check_url = http://cp.cloudflare.com/generate_204
geo_location_checker = http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.cmbchina.com
excluded_routes = 239.255.255.250/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32

[dns]
server = 119.29.29.29
server = 223.5.5.5
server = 1.12.12.12
no-ipv6 = true

[policy]
static = Auto, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 马来西亚节点, 土耳其节点, 阿根廷节点, 德国节点, 直连, img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Auto.png
static = Final, Proxy, 直连, img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Final.png
static = AdBlock, reject, 直连, img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Reject.png
static = Apple, 直连, Proxy, img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Apple.png
static = Netflix, Proxy, 直连, img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Netflix.png
static = YouTube, Proxy, 直连, img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/YouTube.png
static = Telegram, Proxy, 直连, img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Telegram.png
static = GlobalMedia, Proxy, 直连, img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/GlobalMedia.png
static = Proxy, Proxy, 直连, img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Proxy.png
static = BiliBili, 直连, Proxy, img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/BiliBili.png
static = Domestic, 直连, Proxy, img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Direct.png
# 地区策略组
static = 香港节点, server-tag-regex = (?i)(港|HK|Hong|HKG), img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Hong_Kong.png
static = 台湾节点, server-tag-regex = (?i)(台|TW|Tai), img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Taiwan.png
static = 日本节点, server-tag-regex = (?i)(日本|JP|Japan|东京|大阪), img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Japan.png
static = 新加坡节点, server-tag-regex = (?i)(新加坡|SG|Sing|狮城), img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Singapore.png
static = 美国节点, server-tag-regex = (?i)(美|US|United|States|洛杉矶|硅谷|西雅图), img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/United_States.png
static = 马来西亚节点, server-tag-regex = (?i)(马来西亚|马来|MY|Mala), img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Malaysia.png
static = 土耳其节点, server-tag-regex = (?i)(土耳其|土|TR|Turk), img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Turkey.png
static = 阿根廷节点, server-tag-regex = (?i)(阿根廷|AR|Arge), img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Argentina.png
static = 德国节点, server-tag-regex = (?i)(德国|德|DE|Ger|法兰克福), img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Germany.png
static = 直连, DIRECT, img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Direct.png

