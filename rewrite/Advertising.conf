/*
 * 🚫 广告拦截重写规则
 * 基于 blackmatrix7 广告重写，补充国内应用特定规则
 */

// ════════════════════════════════════════════════════════════
// 微博广告
// ════════════════════════════════════════════════════════════
^https?://(ad|ads|advert|adagency|adserver|adapter|advertise|advertisement|adservice|adspot|adzone|alog)\.weibo\.(com|cn)/.+\?(.*) url reject-2000
^https?://(simg|wx)\.(alikunlun|alicdn)\.com/.*(ad|ads|advert).* url reject-2000
^https?://(.+\.)?(admaster|sinaimg\.cn|wtrain)\.(com|cn)/.*(ad|ads|advert|spm).* url reject-2000

// ════════════════════════════════════════════════════════════
// 知乎广告
// ════════════════════════════════════════════════════════════
^https?://www\.zhihu\.com/api/v4/.*(recommend|feed|ad|advert|promote|promotion|banner|splash|commercial).* url reject-2000
^https?://www\.zhihu\.com/api/v4/answer.* url reject-2000
^https?://www\.zhihu\.com/api/v4/moments.* url reject-2000
^https?://www\.zhihu\.com/api/v4/questions/.*(recommend|commercial).* url reject-2000
^https?://zhuanlan\.zhihu\.com/api/posts/.*(recommend|suggest|advert).* url reject-2000
^https?://(.+\.)?zhimg\.com/.*(ad|advert|promote).* url reject-2000

// ════════════════════════════════════════════════════════════
// B站广告 (视频广告、启动广告、信息流广告)
// ════════════════════════════════════════════════════════════
^https?://api\.bilibili\.com/x/v2/splash.* url reject-2000
^https?://api\.bilibili\.com/x/v2/account/mine.* url reject-2000
^https?://api\.bilibili\.com/x/v2/feed.* url reject-2000
^https?://api\.bilibili\.com/x/v2/show.* url reject-2000
^https?://api\.bilibili\.com/x/v2/growth.* url reject-2000
^https?://api\.bilibili\.com/x/v2/activity.* url reject-2000
^https?://api\.bilibili\.com/x/v2/splash/log.* url reject-2000
^https?://api\.bilibili\.com/x/v2/ad.* url reject-2000
^https?://api\.bilibili\.com/x/v2/resource.* url reject-2000
^https?://api\.bilibili\.com/x/v2/region.* url reject-2000
^https?://api\.bilibili\.com/x/v2/rank.* url reject-2000
^https?://(.+\.)?biliapi\.(com|net)/x/v2/splash.* url reject-2000
^https?://(.+\.)?biliapi\.(com|net)/x/v2/ad.* url reject-2000
^https?://(.+\.)?hdslb\.com/.*(ad|advert|splash).* url reject-2000

// ════════════════════════════════════════════════════════════
// 抖音/TikTok 广告
// ════════════════════════════════════════════════════════════
^https?://(.+\.)?(snssdk|amemv|douyin|iesdouyin|pstatp|toutiao)\.(com|net)/.*(ad|advert|promote|commercial|feed|splash|open).* url reject-2000
^https?://(.+\.)?(byteoversea|tik-tokapi|tiktokv)\.com/.*(ad|advert|promote).* url reject-2000
^https?://(.+\.)?pstatp\.com/.*(ad|advert|promote).* url reject-2000
^https?://(.+\.)?(isnssdk|sgpstatp)\.com/.*(ad|advert).* url reject-2000

// ════════════════════════════════════════════════════════════
// 小红书广告
// ════════════════════════════════════════════════════════════
^https?://(.+\.)?xiaohongshu\.com/api/sns/v1/feed.* url reject-2000
^https?://(.+\.)?xiaohongshu\.com/api/sns/v1/search/.* url reject-2000
^https?://(.+\.)?xiaohongshu\.com/api/sns/v1/recommend.* url reject-2000
^https?://(.+\.)?xiaohongshu\.com/api/sns/v1/splash.* url reject-2000
^https?://(.+\.)?xhscdn\.com/.*(ad|advert).* url reject-2000

[MITM]
hostname = *.weibo.com, *.weibo.cn, *.zhihu.com, *.zhimg.com, *.bilibili.com, *.biliapi.com, *.hdslb.com, *.douyin.com, *.iesdouyin.com, *.snssdk.com, *.pstatp.com, *.toutiao.com, *.byteoversea.com, *.tiktokv.com, *.xiaohongshu.com, *.xhscdn.com
